name: tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov -e .

      - name: Run tests
        run: python -m pytest

      - name: Verify CLI
        run: tidal-dl-sg --help
